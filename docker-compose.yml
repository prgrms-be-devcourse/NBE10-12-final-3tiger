services:
  postgres:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: walking-mvp-postgis-pgrouting:17-3.5
    platform: linux/amd64
    container_name: walking-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: walking_mvp
      POSTGRES_USER: walking
      POSTGRES_PASSWORD: walking
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./final-2026-08-gs-yc-v1/walking_mvp_final.dump:/tmp/walking_mvp_final.dump:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - ./docker/auth-migration.sql:/tmp/auth-migration.sql:ro
      - ./docker/20-auth-migration.sh:/docker-entrypoint-initdb.d/20-auth-migration.sh:ro
      - ./docker/30-social-schema.sql:/tmp/social-schema.sql:ro
      - ./docker/30-social-schema.sh:/docker-entrypoint-initdb.d/30-social-schema.sh:ro
      - ./docker/post-like-unique-constraint.sql:/tmp/post-like-unique-constraint.sql:ro
      - ./docker/40-post-like-unique-constraint.sh:/docker-entrypoint-initdb.d/40-post-like-unique-constraint.sh:ro
      - ./docker/comment-upvote-unique-constraint.sql:/tmp/comment-upvote-unique-constraint.sql:ro
      - ./docker/60-comment-upvote-unique-constraint.sh:/docker-entrypoint-initdb.d/60-comment-upvote-unique-constraint.sh:ro
      - ./docker/comment-reply.sql:/tmp/comment-reply.sql:ro
      - ./docker/70-comment-reply.sh:/docker-entrypoint-initdb.d/70-comment-reply.sh:ro
      - ./docker/80-bookmark-activity.sql:/tmp/bookmark-activity.sql:ro
      - ./docker/80-bookmark-activity.sh:/docker-entrypoint-initdb.d/80-bookmark-activity.sh:ro
      - ./docker/90-user-memo.sql:/tmp/user-memo.sql:ro
      - ./docker/90-user-memo.sh:/docker-entrypoint-initdb.d/90-user-memo.sh:ro
      - ./docker/post-title-migration.sql:/tmp/post-title-migration.sql:ro
      - ./docker/95-post-title-migration.sh:/docker-entrypoint-initdb.d/95-post-title-migration.sh:ro
      - ./docker/100-notification-setting.sql:/tmp/notification-setting.sql:ro
      - ./docker/100-notification-setting.sh:/docker-entrypoint-initdb.d/100-notification-setting.sh:ro
      - ./docker/hazard-schema.sql:/tmp/hazard-schema.sql:ro
      - ./docker/96-hazard-schema.sh:/docker-entrypoint-initdb.d/96-hazard-schema.sh:ro
      - ./docker/110-report-schema.sql:/tmp/report-schema.sql:ro
      - ./docker/110-report-schema.sh:/docker-entrypoint-initdb.d/110-report-schema.sh:ro
      - ./docker/120-user-block-schema.sql:/tmp/user-block-schema.sql:ro
      - ./docker/120-user-block-schema.sh:/docker-entrypoint-initdb.d/120-user-block-schema.sh:ro
      - ./docker/130-point-reward-schema.sql:/tmp/point-reward-schema.sql:ro
      - ./docker/130-point-reward-schema.sh:/docker-entrypoint-initdb.d/130-point-reward-schema.sh:ro
      - ./docker/140-course-path-write-validation.sql:/tmp/course-path-write-validation.sql:ro
      - ./docker/140-course-path-write-validation.sh:/docker-entrypoint-initdb.d/140-course-path-write-validation.sh:ro
      - ./docker/141-shop-schema.sql:/tmp/shop-schema.sql:ro
      - ./docker/141-shop-schema.sh:/docker-entrypoint-initdb.d/141-shop-schema.sh:ro
      - ./docker/142-hazard-resolution.sql:/tmp/hazard-resolution.sql:ro
      - ./docker/142-hazard-resolution.sh:/docker-entrypoint-initdb.d/142-hazard-resolution.sh:ro
      - ./docker/143-course-map-image.sql:/tmp/course-map-image.sql:ro
      - ./docker/143-course-map-image.sh:/docker-entrypoint-initdb.d/143-course-map-image.sh:ro
      - ./docker/144-push-token-schema.sql:/tmp/push-token-schema.sql:ro
      - ./docker/144-push-token-schema.sh:/docker-entrypoint-initdb.d/144-push-token-schema.sh:ro
      - ./docker/145-course-map-image-status.sql:/tmp/course-map-image-status.sql:ro
      - ./docker/145-course-map-image-status.sh:/docker-entrypoint-initdb.d/145-course-map-image-status.sh:ro
      - ./docker/146-persona-default.sql:/tmp/146-persona-default.sql:ro
      - ./docker/146-persona-default.sh:/docker-entrypoint-initdb.d/146-persona-default.sh:ro
      - ./docker/147-weekly-walk-query.sql:/tmp/weekly-walk-query.sql:ro
      - ./docker/147-weekly-walk-query.sh:/docker-entrypoint-initdb.d/147-weekly-walk-query.sh:ro
      - ./docker/21_persona_weight.sql:/tmp/persona/21_persona_weight.sql:ro
      - ./docker/22_persona_course_scores.sql:/tmp/persona/22_persona_course_scores.sql:ro
      - ./docker/23_persona_edge_costs.sql:/tmp/persona/23_persona_edge_costs.sql:ro
      - ./docker/24_generate_functions_persona.sql:/tmp/persona/24_generate_functions_persona.sql:ro
      - ./docker/25_oneway_routing.sql:/tmp/persona/25_oneway_routing.sql:ro
      - ./docker/50-persona-migration.sh:/docker-entrypoint-initdb.d/50-persona-migration.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walking -d walking_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: walking-mvp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
