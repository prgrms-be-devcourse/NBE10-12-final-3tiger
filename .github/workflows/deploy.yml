name: Deploy to EC2
on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'docker/**/*.sql'
      - '.github/workflows/deploy.yml'
concurrency:
  group: deploy-ec2-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            source /etc/environment
            cd ~/NBE10-12-final-3tiger
            echo "=== Update source ==="
            git pull --ff-only origin main

            echo "=== Detect changed SQL migrations ==="
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "[migrate] No previous SHA (first push or force-push). Skipping SQL diff — apply manually if needed."
              CHANGED_SQL=""
            else
              CHANGED_SQL=$(git diff --name-only "$BEFORE_SHA" HEAD -- 'docker/' | { grep '\.sql$' || true; } | sort)
            fi

            if [ -n "$CHANGED_SQL" ]; then
              echo "=== Apply changed SQL migrations ==="
              echo "$CHANGED_SQL" | sed 's/^/  - /'
              while IFS= read -r f; do
                [ -f "$f" ] || { echo "[migrate] Skipping deleted file: $f"; continue; }
                echo "[migrate] Applying $f"
                docker cp "$f" walking-mvp-postgres:/tmp/mig.sql
                docker exec walking-mvp-postgres \
                  psql -U walking -d walking_mvp \
                  -v ON_ERROR_STOP=1 -f /tmp/mig.sql
              done <<< "$CHANGED_SQL"
              echo "[migrate] All migrations applied successfully."
            else
              echo "[migrate] No SQL changes in this push."
            fi

            cd back
            echo "=== Build ==="
            java -version
            ./gradlew build -x test
            JAR="build/libs/back-0.0.1-SNAPSHOT.jar"
            test -f "$JAR"
            PATTERN='^([^[:space:]]*/)?java[[:space:]].*-jar[[:space:]]+([^[:space:]]*/)?back-0[.]0[.]1-SNAPSHOT[.]jar([[:space:]]|$)'
            echo "=== Stop existing backend ==="
            PIDS=$(pgrep -f "$PATTERN" || true)
            if [ -n "$PIDS" ]; then
              echo "Stopping PID(s): $PIDS"
              kill $PIDS
              COUNT=0
              while pgrep -f "$PATTERN" > /dev/null; do
                COUNT=$((COUNT + 1))
                if [ "$COUNT" -ge 30 ]; then
                  echo "ERROR: Existing backend did not stop."
                  exit 1
                fi
                sleep 1
              done
            fi
            echo "=== Start backend ==="
            setsid nohup java -Xmx512m -jar "$JAR" \
              > backend.log 2>&1 < /dev/null &
            sleep 10
            echo "=== Verify backend process ==="
            if pgrep -af "$PATTERN"; then
              echo "Backend process is running."
            else
              echo "ERROR: Backend exited during startup."
              tail -n 100 backend.log
              exit 1
            fi