name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'back/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/NBE10-12-final-3tiger
            git pull origin main
            cd back
            ./gradlew build -x test
            PID=$(pgrep -f "back-0.0.1-SNAPSHOT.jar") || true
            if [ -n "$PID" ]; then
              kill $PID
              sleep 5
            fi
            nohup java -Xmx512m -jar build/libs/back-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &