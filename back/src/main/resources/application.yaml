spring:
  application:
    name: back
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5433/walking_mvp
    username: walking
    password: walking
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800      # 30분
    refresh-token-expiry: 1209600  # 14일
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  place:
    kakao:
      rest-api-key: ${KAKAO_PLACE_REST_API_KEY}
      connect-timeout: 2s
      read-timeout: 3s
  storage:
    type: ${STORAGE_TYPE:local}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/local-uploads}
    local-directory: build/local-uploads
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
