spring:
  application:
    name: back
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5433/walking_mvp
    username: walking
    password: walking
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul

app:
  auth:
    allow-dev-user: true
    dev-user-id: 1
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800      # 30분
    refresh-token-expiry: 1209600  # 14일
  storage:
    public-base-url: http://localhost:8080/local-uploads

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
