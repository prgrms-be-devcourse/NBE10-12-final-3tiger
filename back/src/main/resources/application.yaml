server:
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json

spring:
  application:
    name: back
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  datasource:
    url: jdbc:postgresql://localhost:5433/walking_mvp
    username: walking
    password: walking
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul

app:
  email-verification:
    from: ${MAIL_FROM:no-reply@todaywalk.local}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 1800      # 30분
    refresh-token-expiry: 1209600  # 14일
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  place:
    kakao:
      base-url: ${KAKAO_PLACE_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_PLACE_REST_API_KEY}
      connect-timeout: 2s
      read-timeout: 3s
    naver-api-hub:
      base-url: ${NAVER_API_HUB_BASE_URL:https://naverapihub.apigw.ntruss.com}
      client-id: ${NAVER_API_HUB_CLIENT_ID:}
      client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}
      connect-timeout: 2s
      read-timeout: 2s
    rate-limit:
      limit: ${PLACE_SEARCH_RATE_LIMIT:30}
      window: ${PLACE_SEARCH_RATE_LIMIT_WINDOW:60s}
  map:
    kakao:
      rest-api-key: ${KAKAO_PLACE_REST_API_KEY}
      connect-timeout: 2s
      read-timeout: 5s
    naver:
      base-url: ${NAVER_MAP_BASE_URL:https://maps.apigw.ntruss.com}
      client-id: ${NAVER_MAP_CLIENT_ID:}
      client-secret: ${NAVER_MAP_CLIENT_SECRET:}
      connect-timeout: 2s
      read-timeout: 3s
  report:
    hide-threshold: 5   # 신고 누적 시 자동 숨김 임계치
  push:
    expo:
      api-url: ${EXPO_PUSH_API_URL:https://exp.host/--/api/v2/push/send}
      connect-timeout: 2s
      read-timeout: 5s
  storage:
    type: ${STORAGE_TYPE:local}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/local-uploads}
    local-directory: build/local-uploads
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
