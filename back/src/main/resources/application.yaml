spring:
  application:
    name: back
  datasource:
    url: jdbc:h2:mem:todaywalk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  auth:
    allow-dev-user: true
    dev-user-id: 1
  storage:
    public-base-url: http://localhost:8080/local-uploads

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
